name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    name: Build & Deploy Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}

      - name: Copy worker to output directory
        run: cp apps/web/worker.js apps/web/out/_worker.js

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: enterprise-prod
          directory: apps/web/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          VERSION=$(node -p "require('./apps/web/package.json').version")
          git tag -a "v$VERSION-$(date +%Y%m%d%H%M%S)" -m "Production release v$VERSION"
          git push origin --tags
